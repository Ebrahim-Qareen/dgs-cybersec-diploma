<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Normal vs malicious process tree" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Process Tree: Normal vs Malicious</title>
<defs><style>
.t{fill:#e8eef6;font-family:ui-monospace,Consolas,monospace}
.h{fill:#e8eef6;font-family:system-ui,Arial,sans-serif;font-weight:700}
.ln{stroke:#2b4a6b;stroke-width:2;fill:none}
.b{fill:#12233d;stroke:#24466e;stroke-width:1.5;rx:6}
.bad{fill:#3a1720;stroke:#c0392b;stroke-width:1.5}
</style></defs>
<text class="h" x="170" y="30" text-anchor="middle" font-size="15">Normal</text>
<text class="h" x="545" y="30" text-anchor="middle" font-size="15">Suspicious</text>
<rect class="b" x="70" y="50" width="200" height="34" rx="6"/><text class="t" x="82" y="72" font-size="13">explorer.exe</text>
<path class="ln" d="M100 84 v40 h30"/>
<rect class="b" x="130" y="126" width="200" height="34" rx="6"/><text class="t" x="142" y="148" font-size="13">winword.exe</text>
<path class="ln" d="M160 160 v40 h30"/>
<rect class="b" x="190" y="202" width="220" height="34" rx="6"/><text class="t" x="202" y="224" font-size="13">outlook.exe (child ok)</text>
<rect class="bad" x="445" y="50" width="200" height="34" rx="6"/><text class="t" x="457" y="72" font-size="13">winword.exe</text>
<path class="ln" d="M475 84 v34 h30"/>
<rect class="bad" x="505" y="120" width="200" height="34" rx="6"/><text class="t" x="517" y="142" font-size="13">powershell.exe -enc</text>
<path class="ln" d="M535 154 v34 h30"/>
<rect class="bad" x="565" y="190" width="150" height="34" rx="6"/><text class="t" x="577" y="212" font-size="13">cmd.exe</text>
<path class="ln" d="M600 224 v30 h30"/>
<rect class="bad" x="600" y="256" width="115" height="34" rx="6"/><text class="t" x="612" y="278" font-size="12">reverse shell</text>
<text x="545" y="306" text-anchor="middle" font-size="12" fill="#E48424" font-family="system-ui,Arial">macro spawning PowerShell = red flag (T1059.001)</text>
</svg>
