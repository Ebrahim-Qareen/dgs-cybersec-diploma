<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-label="Windows persistence locations Autoruns covers" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Persistence Map</title>
<defs><style>
.h{fill:#e8eef6;font-family:system-ui,Arial,sans-serif;font-weight:700}
.m{fill:#9fb3c8;font-family:ui-monospace,Consolas,monospace}
</style></defs>
<text class="h" x="350" y="35" text-anchor="middle" font-size="16">Autoruns sees all of these  (T1547 / T1053 / T1543)</text>
<rect x="40" y="70" width="200" height="70" rx="8" fill="#12233d" stroke="#E48424" stroke-width="1.5"/><text class="h" x="140" y="100" text-anchor="middle" font-size="14">Run key</text><text class="m" x="140" y="122" text-anchor="middle" font-size="12">HKCU\...\Run</text><rect x="260" y="70" width="200" height="70" rx="8" fill="#12233d" stroke="#E48424" stroke-width="1.5"/><text class="h" x="360" y="100" text-anchor="middle" font-size="14">Startup folder</text><text class="m" x="360" y="122" text-anchor="middle" font-size="12">shell:startup</text><rect x="480" y="70" width="200" height="70" rx="8" fill="#12233d" stroke="#E48424" stroke-width="1.5"/><text class="h" x="580" y="100" text-anchor="middle" font-size="14">Scheduled Task</text><text class="m" x="580" y="122" text-anchor="middle" font-size="12">schtasks</text><rect x="40" y="160" width="200" height="70" rx="8" fill="#12233d" stroke="#E48424" stroke-width="1.5"/><text class="h" x="140" y="190" text-anchor="middle" font-size="14">Service</text><text class="m" x="140" y="212" text-anchor="middle" font-size="12">7045</text><rect x="260" y="160" width="200" height="70" rx="8" fill="#12233d" stroke="#E48424" stroke-width="1.5"/><text class="h" x="360" y="190" text-anchor="middle" font-size="14">Driver</text><text class="m" x="360" y="212" text-anchor="middle" font-size="12">kernel</text><rect x="480" y="160" width="200" height="70" rx="8" fill="#12233d" stroke="#E48424" stroke-width="1.5"/><text class="h" x="580" y="190" text-anchor="middle" font-size="14">DLL hijack</text><text class="m" x="580" y="212" text-anchor="middle" font-size="12">search order</text>
</svg>
