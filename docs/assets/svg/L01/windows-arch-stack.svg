<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Windows architecture layers">
<g data-explain="apps" tabindex="0" role="button" aria-label="Applications / user tools"><rect x="40" y="30" width="480" height="46" rx="8" fill="#185490" stroke="#24466e"/><text x="280" y="59" text-anchor="middle" font-size="15" font-weight="600" fill="#e8eef6" font-family="system-ui, &#39;Segoe UI&#39;, Roboto, Arial, sans-serif" >Applications / user tools</text></g>
<g data-explain="user" tabindex="0" role="button" aria-label="User mode  (subsystems, services)"><rect x="40" y="88" width="480" height="46" rx="8" fill="#185490" stroke="#24466e"/><text x="280" y="117" text-anchor="middle" font-size="15" font-weight="600" fill="#e8eef6" font-family="system-ui, &#39;Segoe UI&#39;, Roboto, Arial, sans-serif" >User mode  (subsystems, services)</text></g>
<g data-explain="kernel" tabindex="0" role="button" aria-label="Executive + Kernel  (ntoskrnl)"><rect x="40" y="146" width="480" height="46" rx="8" fill="#0C3060" stroke="#24466e"/><text x="280" y="175" text-anchor="middle" font-size="15" font-weight="600" fill="#e8eef6" font-family="system-ui, &#39;Segoe UI&#39;, Roboto, Arial, sans-serif" >Executive + Kernel  (ntoskrnl)</text></g>
<g data-explain="hal" tabindex="0" role="button" aria-label="HAL  (Hardware Abstraction Layer)"><rect x="40" y="204" width="480" height="46" rx="8" fill="#0C3060" stroke="#24466e"/><text x="280" y="233" text-anchor="middle" font-size="15" font-weight="600" fill="#e8eef6" font-family="system-ui, &#39;Segoe UI&#39;, Roboto, Arial, sans-serif" >HAL  (Hardware Abstraction Layer)</text></g>
<g data-explain="hw" tabindex="0" role="button" aria-label="Hardware  (CPU, RAM, disk, NIC)"><rect x="40" y="262" width="480" height="46" rx="8" fill="#33507a" stroke="#24466e"/><text x="280" y="291" text-anchor="middle" font-size="15" font-weight="600" fill="#e8eef6" font-family="system-ui, &#39;Segoe UI&#39;, Roboto, Arial, sans-serif" >Hardware  (CPU, RAM, disk, NIC)</text></g>
<g data-explain="line" tabindex="0" role="button" aria-label="user / kernel line"><rect x="40" y="130" width="600" height="20" fill="transparent"/><line x1="40" y1="140" x2="520" y2="140" stroke="#E48424" stroke-width="2" stroke-dasharray="6 6"/><text x="528" y="144" text-anchor="start" font-size="10.5" font-weight="400" fill="#E48424" font-family="system-ui, &#39;Segoe UI&#39;, Roboto, Arial, sans-serif" >user / kernel line</text></g>
<text x="280" y="345" text-anchor="middle" font-size="12" font-weight="400" fill="#a8bbd6" font-family="system-ui, &#39;Segoe UI&#39;, Roboto, Arial, sans-serif" >malware wants to move down this stack — the lower it gets, the harder it is to see</text>
</svg>
