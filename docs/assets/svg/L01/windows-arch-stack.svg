<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-label="Windows architecture layers" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Windows Architecture Stack</title>
<defs><style>.t{fill:#e8eef6;font-family:system-ui,Segoe UI,Arial,sans-serif}</style></defs>
<rect x="40" y="50" width="480" height="50" rx="8" fill="#185490" stroke="#24466e"/><text class="t" x="280" y="80" text-anchor="middle" font-size="15" font-weight="600">Applications / user tools</text><rect x="40" y="112" width="480" height="50" rx="8" fill="#185490" stroke="#24466e"/><text class="t" x="280" y="142" text-anchor="middle" font-size="15" font-weight="600">User mode  (subsystems, services)</text><rect x="40" y="174" width="480" height="50" rx="8" fill="#0C3060" stroke="#24466e"/><text class="t" x="280" y="204" text-anchor="middle" font-size="15" font-weight="600">Executive + Kernel  (ntoskrnl)</text><rect x="40" y="236" width="480" height="50" rx="8" fill="#0C3060" stroke="#24466e"/><text class="t" x="280" y="266" text-anchor="middle" font-size="15" font-weight="600">HAL  (Hardware Abstraction Layer)</text><rect x="40" y="298" width="480" height="50" rx="8" fill="#33507a" stroke="#24466e"/><text class="t" x="280" y="328" text-anchor="middle" font-size="15" font-weight="600">Hardware  (CPU, RAM, disk, NIC)</text>
<text class="t" x="280" y="405" text-anchor="middle" font-size="12" fill="#9fb3c8">user mode above the line, kernel mode below HAL</text>
</svg>
