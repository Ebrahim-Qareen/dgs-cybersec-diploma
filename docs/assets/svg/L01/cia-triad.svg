<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-label="CIA triad with bank-account analogy" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>CIA Triad</title>
<defs><style>
.t{fill:#e8eef6;font-family:system-ui,Segoe UI,Arial,sans-serif}
.m{fill:#9fb3c8;font-family:system-ui,Segoe UI,Arial,sans-serif}
.edge{fill:none;stroke:#E48424;stroke-width:3}
</style></defs>
<polygon class="edge" points="280,40 500,400 60,400"/>
<circle cx="280" cy="40" r="30" fill="#185490"/>
<circle cx="500" cy="400" r="30" fill="#185490"/>
<circle cx="60" cy="400" r="30" fill="#185490"/>
<text class="t" x="280" y="46" text-anchor="middle" font-size="22" font-weight="700">C</text>
<text class="t" x="500" y="406" text-anchor="middle" font-size="22" font-weight="700">I</text>
<text class="t" x="60" y="406" text-anchor="middle" font-size="22" font-weight="700">A</text>
<text class="t" x="280" y="95" text-anchor="middle" font-size="18" font-weight="700">Confidentiality</text>
<text class="m" x="280" y="118" text-anchor="middle" font-size="13">Only YOU see the balance</text>
<text class="t" x="500" y="360" text-anchor="middle" font-size="18" font-weight="700">Integrity</text>
<text class="m" x="500" y="440" text-anchor="middle" font-size="13">Balance is correct</text>
<text class="t" x="60" y="360" text-anchor="middle" font-size="18" font-weight="700">Availability</text>
<text class="m" x="60" y="440" text-anchor="middle" font-size="13">ATM works 24/7</text>
<text class="t" x="280" y="235" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="2">CIA</text>
<text class="m" x="280" y="260" text-anchor="middle" font-size="13">every attack breaks one pillar</text>
</svg>
