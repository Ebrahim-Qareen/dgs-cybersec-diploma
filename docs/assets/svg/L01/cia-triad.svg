<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="CIA triad with the bank-account analogy" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<polygon points="280,70 500,380 60,380" fill="none" stroke="#E48424" stroke-width="3" stroke-linejoin="round"/>
<circle cx="280" cy="70" r="28" fill="#185490" stroke="#0b1220" stroke-width="3"/><text x="280" y="78" text-anchor="middle" font-size="22" font-weight="700" fill="#e8eef6" font-family="system-ui, &#39;Segoe UI&#39;, Roboto, Arial, sans-serif" >C</text>
<circle cx="500" cy="380" r="28" fill="#185490" stroke="#0b1220" stroke-width="3"/><text x="500" y="388" text-anchor="middle" font-size="22" font-weight="700" fill="#e8eef6" font-family="system-ui, &#39;Segoe UI&#39;, Roboto, Arial, sans-serif" >I</text>
<circle cx="60" cy="380" r="28" fill="#185490" stroke="#0b1220" stroke-width="3"/><text x="60" y="388" text-anchor="middle" font-size="22" font-weight="700" fill="#e8eef6" font-family="system-ui, &#39;Segoe UI&#39;, Roboto, Arial, sans-serif" >A</text>
<text x="280" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#e8eef6" font-family="system-ui, &#39;Segoe UI&#39;, Roboto, Arial, sans-serif" >Confidentiality</text>
<text x="280" y="48" text-anchor="middle" font-size="12.5" font-weight="400" fill="#a8bbd6" font-family="system-ui, &#39;Segoe UI&#39;, Roboto, Arial, sans-serif" >only YOU see the balance</text>
<text x="500" y="425" text-anchor="middle" font-size="18" font-weight="700" fill="#e8eef6" font-family="system-ui, &#39;Segoe UI&#39;, Roboto, Arial, sans-serif" >Integrity</text>
<text x="500" y="445" text-anchor="middle" font-size="12.5" font-weight="400" fill="#a8bbd6" font-family="system-ui, &#39;Segoe UI&#39;, Roboto, Arial, sans-serif" >the balance is correct</text>
<text x="60" y="425" text-anchor="middle" font-size="18" font-weight="700" fill="#e8eef6" font-family="system-ui, &#39;Segoe UI&#39;, Roboto, Arial, sans-serif" >Availability</text>
<text x="60" y="445" text-anchor="middle" font-size="12.5" font-weight="400" fill="#a8bbd6" font-family="system-ui, &#39;Segoe UI&#39;, Roboto, Arial, sans-serif" >the ATM works 24/7</text>
<text x="280" y="235" text-anchor="middle" font-size="22" font-weight="800" fill="#e8eef6" font-family="system-ui, &#39;Segoe UI&#39;, Roboto, Arial, sans-serif" letter-spacing="3">CIA</text>
<text x="280" y="258" text-anchor="middle" font-size="12.5" font-weight="400" fill="#a8bbd6" font-family="system-ui, &#39;Segoe UI&#39;, Roboto, Arial, sans-serif" >every attack breaks one pillar</text>
</svg>
