<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="Type 1 vs Type 2 hypervisor" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Type 1 vs Type 2 Hypervisor</title>
<defs><style>
.t{fill:#e8eef6;font-family:system-ui,Arial,sans-serif;font-weight:600}
.m{fill:#9fb3c8;font-family:system-ui,Arial,sans-serif}
</style></defs>
<text class="t" x="160" y="28" text-anchor="middle" font-size="15">Type 1 (bare metal)</text>
<rect x="40" y="40" width="240" height="34" rx="6" fill="#185490"/><text class="t" x="160" y="63" text-anchor="middle" font-size="13">VM   VM   VM</text>
<rect x="40" y="80" width="240" height="30" rx="6" fill="#0C3060"/><text class="t" x="160" y="100" text-anchor="middle" font-size="12">Hypervisor (ESXi/Hyper-V)</text>
<rect x="40" y="116" width="240" height="30" rx="6" fill="#33507a"/><text class="t" x="160" y="136" text-anchor="middle" font-size="12">Hardware</text>
<text class="t" x="460" y="28" text-anchor="middle" font-size="15">Type 2 (hosted)</text>
<rect x="340" y="40" width="240" height="34" rx="6" fill="#185490"/><text class="t" x="460" y="63" text-anchor="middle" font-size="13">VM   VM</text>
<rect x="340" y="80" width="240" height="30" rx="6" fill="#E48424"/><text x="460" y="100" text-anchor="middle" font-size="12" fill="#0b1220" font-family="system-ui">VMware Workstation / VirtualBox</text>
<rect x="340" y="116" width="240" height="30" rx="6" fill="#0C3060"/><text class="t" x="460" y="136" text-anchor="middle" font-size="12">Host OS (Windows)</text>
<rect x="340" y="152" width="240" height="30" rx="6" fill="#33507a"/><text class="t" x="460" y="172" text-anchor="middle" font-size="12">Hardware</text>
<text class="m" x="310" y="230" text-anchor="middle" font-size="12">DGS lab uses Type 2 on student laptops; host-only 10.10.10.0/24</text>
</svg>
